<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Системное уведомление</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Фон с падающими/бегущими цифрами (Matrix style) */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Экран блокировки */
        .lock-container {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
            border-radius: 15px;
            padding: 25px;
            width: 90%;
            max-width: 420px;
            text-align: center;
        }

        .hacked-title {
            color: #ff0000;
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ff0000;
            animation: blink 0.8s infinite alternate;
            margin-bottom: 10px;
        }

        .blocked-subtitle {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .code-box {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            color: #00ff41;
            text-align: left;
            height: 140px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .lock-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        @keyframes blink {
            from { opacity: 1; text-shadow: 0 0 10px #ff0000; }
            to { opacity: 0.3; text-shadow: none; }
        }
    </style>
</head>
<body>

    <!-- Фон с бегущими зелёными цифрами -->
    <canvas id="matrix"></canvas>

    <!-- Главный блок -->
    <div class="lock-container">
        <div class="lock-icon">🔒</div>
        <h1 class="hacked-title">ВЫ ВЗЛОМАНЫ</h1>
        <h2 class="blocked-subtitle">Ваш телефон заблокирован</h2>
        
        <div class="code-box" id="code-log">
            > Подбор ключа доступа...<br>
        </div>
    </div>

    <script>
        // Настройка фона с бегущими зелёными цифрами и символами
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        const chars = '0123456789ABCDEFGHJKLMNPQRSTUVWXYZ';
        const fontSize = 16;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff41';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 33);

        // Генерация случайных системных кодов в блоке
        const codeLog = document.getElementById('code-log');
        
        function getRandomHex() {
            return '0x' + Math.floor(Math.random() * 0xFFFFFF).toString(16).toUpperCase().padStart(6, '0');
        }

        setInterval(() => {
            const newCode = `> CODE: ${getRandomHex()} | BLOCK_ID: ${Math.floor(1000 + Math.random() * 9000)}`;
            const p = document.createElement('div');
            p.innerText = newCode;
            codeLog.appendChild(p);

            if (codeLog.children.length > 6) {
                codeLog.removeChild(codeLog.children[0]);
            }
        }, 300);

        // Адаптация размера при изменении экрана
        window.addEventListener('resize', () => {
            canvas.height = window.innerHeight;
            canvas.width = window.innerWidth;
        });
    </script>
</body>
</html>
