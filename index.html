<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Error 404</title>
    <style>
        body {
            background-color: #000;
            color: #ff0033;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            font-size: 24px;
            text-transform: uppercase;
            border-bottom: 2px solid #ff0033;
            padding-bottom: 10px;
        }
        .code-line {
            font-size: 14px;
            line-height: 1.6;
            margin: 5px 0;
        }
        .green { color: #00ff66; }
        .yellow { color: #ffcc00; }
        .white { color: #ffffff; }
        .alert {
            background: rgba(255, 0, 51, 0.2);
            border: 1px solid #ff0033;
            padding: 15px;
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
            font-size: 18px;
            animation: blink 0.5s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }
    </style>
</head>
<body>

<h1>⚠️ CRITICAL SECURITY BREACH</h1>
<div id="terminal">
    <div class="code-line">Инициализация взлома ядра...</div>
</div>

<script>
    const lines = [
        "<span class='green'>[+] Подключение к хосту GitHub... Успешно.</span>",
        "<span class='white'>[!] Перехват файлов пользователя... 14%</span>",
        "<span class='white'>[!] Перехват файлов пользователя... 68%</span>",
        "<span class='white'>[!] Перехват файлов пользователя... 100% (Завершено)</span>",
        "<span class='yellow'>[*] Поиск секретных папок... Найдено: Школа Марио, Дневник, Кошарик.</span>",
        "<span class='green'>[+] Обход защиты Neocities... Готово.</span>",
        "<span class='yellow'>[!] Внимание: Обнаружена попытка побега Кошарика на Гаити!</span>",
        "<span class='green'>[+] Блокировка координат Гаити... Успешно пресечено.</span>",
        "<div class='alert'>🚨 ВНИМАНИЕ! ДОСТУП ПОЛНОСТЬЮ ПОЛУЧЕН ХАКЕРАМИ! 🚨</div>"
    ];

    let index = 0;
    const terminal = document.getElementById("terminal");

    function addLine() {
        if (index < lines.length) {
            terminal.innerHTML += "<div class='code-line'>" + lines[index] + "</div>";
            index++;
            setTimeout(addLine, 600); // Скорость появления строк (в миллисекундах)
        }
    }

    // Запускаем через секунду после загрузки страницы
    setTimeout(addLine, 1000);
</script>

</body>
</html>
