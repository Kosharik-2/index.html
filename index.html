<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Diagnostic</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .terminal {
            background: #111;
            border: 2px solid #00ff66;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        }
        h2 { margin-top: 0; font-size: 18px; color: #ff0055; text-align: center; }
        p { font-size: 14px; line-height: 1.4; }
        button {
            background: #ff0055;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            margin-top: 15px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover { background: #cc0044; }
    </style>
</head>
<body>

<div class="terminal">
    <h2>⚠️ SYSTEM OVERRIDE</h2>
    <div id="screen">
        <p>Нажмите кнопку ниже, чтобы запустить сканирование и обмануть систему GitHub.</p>
    </div>
    <button onclick="startHack()">ЗАПУСТИТЬ ВЗЛОМ</button>
</div>

<script>
    function startHack() {
        const screen = document.getElementById("screen");
        screen.innerHTML = "<p>Подключение к серверу...</p>";
        
        setTimeout(() => {
            screen.innerHTML += "<p>Сканирование базы данных... Найдено: Гаити (отменено).</p>";
        }, 1000);

        setTimeout(() => {
            screen.innerHTML += "<p style='color: #ffcc00;'>Внимание: Кошарик успешно заблокирован дома. Побег предотвращен!</p>";
        }, 2000);

        setTimeout(() => {
            screen.innerHTML += "<p style='color: #00ff66; font-weight: bold;'>ОБМАН УДАЛСЯ! Система полностью запущена. 😎</p>";
        }, 3000);
    }
</script>

</body>
</html>
