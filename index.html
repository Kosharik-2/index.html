<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>502 Bad Gateway</title>
    <style>
        body {
            background-color: #ffffff;
            color: #222222;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .error-container {
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #111;
        }
        p {
            font-size: 14px;
            line-height: 1.5;
            color: #555;
            margin-bottom: 15px;
        }
        .code-box {
            background: #f4f4f4;
            border: 1px solid #ddd;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            color: #c7254e;
            border-radius: 4px;
            margin-bottom: 20px;
            word-break: break-all;
        }
        .btn {
            background: #0066cc;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover {
            background: #0055b3;
        }
    </style>
</head>
<body>

<div class="error-container">
    <h1 id="error-title">502 Bad Gateway</h1>
    <p id="error-desc">Сервер временно недоступен или получил недопустимый ответ от вышестоящего шлюза.</p>
    
    <div class="code-box" id="error-code">
        nginx/1.18.0 (Ubuntu) — Host: github.io — Cluster ID: #9482-ERR
    </div>

    <button class="btn" onclick="triggerRealism()">Обновить страницу</button>
</div>

<script>
    function triggerRealism() {
        const title = document.getElementById("error-title");
        const desc = document.getElementById("error-desc");
        const code = document.getElementById("error-code");

        title.innerText = "Критическая ошибка базы данных";
        desc.innerText = "Внимание! Обнаружена утечка данных проекта. Кошарик официально начал побег на Гаити. Все счета заморожены.";
        code.innerText = "FATAL_ERROR: cat_escape_detected_to_haiti // Business system halted.";
        code.style.color = "#d9534f";
    }
</script>

</body>
</html>
