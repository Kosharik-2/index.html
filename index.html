<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram — Сквидвард</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0e1621;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            background-color: #0e1621;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
        }

        @media (min-width: 481px) {
            .chat-container {
                height: 85vh;
                border-radius: 12px;
                border: 1px solid #1f2c34;
            }
        }

        /* Шапка профиля Telegram */
        .chat-header {
            background-color: #17212b;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #0e1621;
            z-index: 10;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4fa1c1, #2b5278);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
            margin-right: 12px;
            position: relative;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-info h2 {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        .user-info p {
            font-size: 13px;
            color: #788b9b;
        }

        /* Область сообщений */
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.03"><rect width="100" height="100" fill="%23ffffff"/></svg>');
        }

        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.incoming {
            background-color: #182533;
            color: #ffffff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.outgoing {
            background-color: #2b5278;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message .time {
            font-size: 10px;
            color: #788b9b;
            float: right;
            margin-left: 8px;
            margin-top: 4px;
            line-height: 14px;
        }

        /* Индикатор набора текста */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background-color: #182533;
            padding: 8px 14px;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            margin-bottom: 5px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            align-items: center;
            height: 14px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background-color: #788b9b;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Панель выбора ответов (Интерактивные кнопки) */
        .chat-actions {
            padding: 12px;
            background-color: #17212b;
            border-top: 1px solid #0e1621;
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .btn-choice {
            background-color: #2b5278;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            flex: 1;
            max-width: 150px;
        }

        .btn-choice:hover {
            background-color: #386795;
        }

        .btn-choice:active {
            transform: scale(0.96);
        }

        .btn-no {
            background-color: #2c222e;
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }

        .btn-no:hover {
            background-color: #3c2933;
        }

        /* Поле ввода (заблокированное для атмосферы) */
        .chat-input-area {
            padding: 10px 16px;
            background-color: #17212b;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            background-color: #242f3d;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .chat-input-area input::placeholder {
            color: #788b9b;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Шапка -->
    <div class="chat-header">
        <div class="avatar">
            <!-- Эмодзи или кастомный аватар Сквидварда -->
            🦑
        </div>
        <div class="user-info">
            <h2>Сквидвард Тентаклс</h2>
            <p id="status-text">печатает...</p>
        </div>
    </div>

    <!-- Сообщения -->
    <div class="chat-messages" id="chatMessages">
        <!-- Сюда динамически добавляются сообщения -->
    </div>

    <!-- Индикатор набора -->
    <div class="typing-indicator" id="typingIndicator">
        <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- Кнопки выбора -->
    <div class="chat-actions" id="chatActions" style="display: none;">
        <button class="btn-choice" onclick="handleChoice('yes')">Да! 👍</button>
        <button class="btn-choice btn-no" onclick="handleChoice('no')">Нет 👎</button>
    </div>

    <!-- Поле ввода -->
    <div class="chat-input-area">
        <input type="text" placeholder="Выберите вариант ответа выше..." disabled id="userInput">
    </div>
</div>

<script>
    const messagesContainer = document.getElementById('chatMessages');
    const typingIndicator = document.getElementById('typingIndicator');
    const chatActions = document.getElementById('chatActions');
    const statusText = document.getElementById('status-text');

    let currentStep = 0;
    let isSpamming = false;

    // Сценарий диалога
    const script = [
        {
            sender: 'squidward',
            text: 'Эй, привет! Слышишь? Короче, мне СРОЧНО нужны Роббаксы в Роблоксе, звезды в Телеграме и еще премиум-подписка! Ты же поможешь мне, да?',
            showChoices: true
        },
        {
            sender: 'squidward',
            text: 'Отлично! Я знала, что на тебя можно положиться! Теперь слушай дальше: мне нужно задонатить 10 000 робаксов, купить кучу Telegram Stars и оплатить прокачку в игре! Переведешь мне?',
            showChoices: true
        },
        {
            sender: 'squidward',
            text: 'Ура-ура! Ты лучший! Сумма небольшая, всего-то пара тысяч баксов набежала... Остался последний шаг! Скинь-ка мне быстро номер банковской карты папы или мамы, ну или CVV-код от нее, чтобы я всё оплатила!',
            showChoices: false
        }
    ];

    // Функция форматирования времени
    function getTime() {
        const now = new Date();
        return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    }

    // Добавление сообщения в чат
    function addMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message');
        msgDiv.classList.add(sender === 'squidward' ? 'incoming' : 'outgoing');
        msgDiv.innerHTML = `${text}<span class="time">${getTime()}</span>`;
        messagesContainer.appendChild(msgDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Показать/скрыть индикатор набора
    function showTyping(show, customText = 'печатает...') {
        typingIndicator.style.display = show ? 'block' : 'undefined';
        statusText.innerText = customText;
        if(show) {
            typingIndicator.style.display = 'block';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        } else {
            typingIndicator.style.display = 'none';
            statusText.innerText = 'в сети';
        }
    }

    // Запуск диалога
    function startDialogue() {
        showTyping(true);
        setTimeout(() => {
            showTyping(false);
            addMessage(script[0].text, 'squidward');
            chatActions.style.display = 'flex';
        }, 2000);
    }

    // Обработка выбора пользователя
    function handleChoice(choice) {
        chatActions.style.display = 'none';

        if (choice === 'yes') {
            addMessage('Да', 'user');
            currentStep++;

            if (currentStep < script.length) {
                showTyping(true);
                setTimeout(() => {
                    showTyping(false);
                    addMessage(script[currentStep].text, 'squidward');
                    if (script[currentStep].showChoices) {
                        chatActions.style.display = 'flex';
                    }
                }, 2500);
            }
        } else {
            // Если нажал НЕТ — начинается спам!
            addMessage('Нет', 'user');
            isSpamming = true;
            
            triggerSpamAttack();
        }
    }

    // Функция спама при отказе
    const spamMessages = [
        "В смысле НЕТ?! Срочно давай согласие!",
        "Мне СРОЧНО нужны Роблоксы и Telegram Stars!",
        "Ты чего жадничаешь?! Быстро нажимаешь «Да»!",
        "Я буду спамить, пока ты не согласишься! 😡",
        "Роблокс сам себя не купит! Звёзды сами не появятся!",
        "Ну пожалуйста-пожалуйста-пожалуйста! 😭",
        "ТЫ ДОЛЖЕН МНЕ ПОМОЧЬ!",
        "Нажми «Да», кому говорю!!"
    ];

    function triggerSpamAttack() {
        let spamCount = 0;
        showTyping(true, 'строчит сообщение...');

        const spamInterval = setInterval(() => {
            showTyping(false);
            const randomMsg = spamMessages[Math.floor(Math.random() * spamMessages.length)];
            addMessage(randomMsg, 'squidward');
            spamCount++;

            if (spamCount < spamMessages.length) {
                setTimeout(() => showTyping(true, 'строчит сообщение...'), 500);
            } else {
                clearInterval(spamInterval);
                // После спама снова подсунем выбор, чтобы деваться было некуда :)
                setTimeout(() => {
                    addMessage("Ну всё, хватит ломаться! Выбирай давай по-хорошему:", 'squidward');
                    chatActions.style.display = 'flex';
                }, 1000);
            }
        }, 1200);
    }

    // Старт при загрузке страницы
    window.onload = () => {
        setTimeout(startDialogue, 1000);
    };
</script>

</body>
</html>
